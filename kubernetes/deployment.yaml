apiVersion: apps/v1
kind: Deployment

metadata:
  name: tech-challenge-2-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tech-challenge-2-app

  template:
    metadata:
      labels:
        app: tech-challenge-2-app

    spec:
      containers:
        - name: tech-challenge-2-app
          image: 220912169334.dkr.ecr.us-east-2.amazonaws.com/devops-tech-challenge-2-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10